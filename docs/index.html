<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" type="image/png" href="/img/chroco_icon.png" />
    <link rel="shortcut icon" type="image/png" href="/img/chroco_icon.png" />
    <title>Mermaid Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eff6ff",
                100: "#dbeafe",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
              },
            },
            boxShadow: {
              glow: "0 10px 35px rgba(37, 99, 235, 0.20)",
            },
          },
        },
      };
    </script>
    <style>
      #editor-panel:fullscreen,
      #preview-panel:fullscreen {
        padding: 1.25rem;
      }

      #editor-panel:fullscreen #editor,
      #preview-panel:fullscreen #preview {
        height: calc(100vh - 13rem);
      }

      .mermaidTooltip {
        color: #0f172a;
        background: #fff7ed;
        border: 1px solid #fdba74;
        border-radius: 0.5rem;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.2);
      }
    </style>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "loose",
        theme: "default",
      });

      const sample = `flowchart LR
    subgraph 設計
      A[要件整理] --> B[構成検討]
    end
    subgraph 開発
      B --> C[実装]
      C --> D[レビュー]
    end
    D --> E[リリース]`;

      const editor = document.getElementById("editor");
      const preview = document.getElementById("preview");
      const errorBox = document.getElementById("error");
      const messageBox = document.getElementById("message");
      const renderButton = document.getElementById("render");
      const clearButton = document.getElementById("clear");
      const copyButton = document.getElementById("copy");
      const splitLayout = document.getElementById("split-layout");
      const editorPanel = document.getElementById("editor-panel");
      const previewPanel = document.getElementById("preview-panel");
      const splitHandle = document.getElementById("split-handle");
      const editorFullscreenButton = document.getElementById("editor-fullscreen");
      const previewFullscreenButton = document.getElementById("preview-fullscreen");
      const renderedCodeStorageKey = "mermaid-viewer:rendered-code";
      const minPaneRatio = 0.2;
      const maxPaneRatio = 0.8;
      const desktopMedia = window.matchMedia("(min-width: 1024px)");
      let clickMessages = {};

      const parseClickMessages = (code) => {
        const map = {};
        const regex = /^\s*click\s+(\S+)\s+callback\s+"([^"]*)"/gm;
        for (const match of code.matchAll(regex)) {
          map[match[1]] = match[2];
        }
        return map;
      };

      window.callback = (nodeId) => {
        const description = clickMessages[nodeId] || `${nodeId} をクリックしました。`;
        messageBox.textContent = description;
      };

      const getStoredCode = () => {
        const storedCode = window.sessionStorage.getItem(renderedCodeStorageKey);
        return storedCode && storedCode.trim() ? storedCode : sample;
      };

      editor.value = getStoredCode();

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      const applyPaneRatio = (ratio) => {
        const normalizedRatio = clamp(ratio, minPaneRatio, maxPaneRatio);
        splitLayout.style.setProperty("--editor-pane-width", `${normalizedRatio * 100}%`);
        splitLayout.style.setProperty("--preview-pane-width", `${(1 - normalizedRatio) * 100}%`);
      };

      const updateFullscreenLabel = () => {
        editorFullscreenButton.textContent = document.fullscreenElement === editorPanel ? "全画面終了" : "全画面";
        previewFullscreenButton.textContent = document.fullscreenElement === previewPanel ? "全画面終了" : "全画面";
      };

      const toggleFullscreen = async (target) => {
        if (!document.fullscreenEnabled) {
          errorBox.textContent = "このブラウザでは全画面表示に対応していません。";
          return;
        }

        try {
          if (document.fullscreenElement === target) {
            await document.exitFullscreen();
            return;
          }

          if (document.fullscreenElement) {
            await document.exitFullscreen();
          }

          await target.requestFullscreen();
        } catch (error) {
          errorBox.textContent = error instanceof Error ? error.message : String(error);
        }
      };

      applyPaneRatio(1 / 2);

      const render = async () => {
        errorBox.textContent = "";
        const code = editor.value.trim();

        if (!code) {
          preview.innerHTML = "";
          errorBox.textContent = "Mermaid記法を入力してください。";
          return;
        }

        const id = `mermaid-${Date.now()}`;

        try {
          clickMessages = parseClickMessages(code);
          messageBox.textContent = "ノードをクリックすると、ここに説明が表示されます。";
          const { svg, bindFunctions } = await mermaid.render(id, code);
          preview.innerHTML = `<div class="min-w-max">${svg}</div>`;
          if (bindFunctions) {
            bindFunctions(preview);
          }
          window.sessionStorage.setItem(renderedCodeStorageKey, code);
        } catch (error) {
          preview.innerHTML = "";
          errorBox.textContent = error instanceof Error ? error.message : String(error);
        }
      };

      renderButton.addEventListener("click", render);

      clearButton.addEventListener("click", () => {
        editor.value = "";
        preview.innerHTML = "";
        errorBox.textContent = "";
        messageBox.textContent = "";
        window.sessionStorage.removeItem(renderedCodeStorageKey);
      });

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(editor.value);
          const originalText = copyButton.textContent;
          copyButton.textContent = "コピー済み ✓";
          setTimeout(() => {
            copyButton.textContent = originalText;
          }, 1200);
        } catch {
          errorBox.textContent = "クリップボードへのコピーに失敗しました。";
        }
      });

      editor.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          render();
        }
      });

      splitHandle.addEventListener("pointerdown", (event) => {
        if (!desktopMedia.matches) {
          return;
        }

        event.preventDefault();
        splitHandle.setPointerCapture(event.pointerId);

        const layoutBounds = splitLayout.getBoundingClientRect();

        const onPointerMove = (moveEvent) => {
          const nextRatio = (moveEvent.clientX - layoutBounds.left) / layoutBounds.width;
          applyPaneRatio(nextRatio);
        };

        const onPointerUp = (upEvent) => {
          splitHandle.releasePointerCapture(upEvent.pointerId);
          splitHandle.removeEventListener("pointermove", onPointerMove);
          splitHandle.removeEventListener("pointerup", onPointerUp);
          splitHandle.removeEventListener("pointercancel", onPointerUp);
        };

        splitHandle.addEventListener("pointermove", onPointerMove);
        splitHandle.addEventListener("pointerup", onPointerUp);
        splitHandle.addEventListener("pointercancel", onPointerUp);
      });

      editorFullscreenButton.addEventListener("click", () => toggleFullscreen(editorPanel));
      previewFullscreenButton.addEventListener("click", () => toggleFullscreen(previewPanel));
      document.addEventListener("fullscreenchange", updateFullscreenLabel);
      updateFullscreenLabel();

      render();
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div class="absolute -top-20 left-1/2 h-[35rem] w-[35rem] -translate-x-1/2 rounded-full bg-brand-600/20 blur-3xl"></div>
      <div class="absolute bottom-0 right-0 h-72 w-72 rounded-full bg-fuchsia-500/20 blur-3xl"></div>
    </div>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <header class="mb-6 rounded-2xl border border-white/10 bg-white/5 p-6 backdrop-blur">
        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-brand-100">Documentation Tool</p>
        <h1 class="mt-2 text-2xl font-bold text-white sm:text-3xl">Mermaid Viewer</h1>
        <p class="mt-2 text-sm text-slate-300">
          Mermaid 記法を入力して、すぐに図をプレビューできます。
          <span class="text-slate-400">Ctrl/Cmd + Enter で描画</span>
        </p>
        <p class="mt-2 text-xs text-slate-400">`click ノードID callback "説明文"` に対応しています。</p>
      </header>

      <section
        id="split-layout"
        class="flex flex-col gap-4 lg:h-[40rem] lg:flex-row lg:gap-0"
        style="--editor-pane-width: 50%; --preview-pane-width: 50%;"
      >
        <article
          id="editor-panel"
          class="rounded-2xl border border-white/10 bg-slate-900/75 p-5 shadow-glow backdrop-blur lg:min-w-0 lg:rounded-r-none"
          style="flex-basis: var(--editor-pane-width);"
        >
          <div class="mb-3 flex items-center justify-between gap-3">
            <label for="editor" class="text-sm font-semibold text-slate-100">Mermaid 記法</label>
            <div class="flex items-center gap-2">
              <button
                id="editor-fullscreen"
                type="button"
                class="rounded-lg border border-white/15 bg-white/5 px-3 py-1 text-xs font-semibold text-slate-100 transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-slate-400/40"
              >
                全画面
              </button>
              <span class="rounded-full border border-brand-300/30 bg-brand-500/10 px-3 py-1 text-xs text-brand-100">Live Editor</span>
            </div>
          </div>
          <textarea
            id="editor"
            spellcheck="false"
            class="h-[24rem] w-full resize-y rounded-xl border border-white/10 bg-slate-950/80 p-4 font-mono text-sm leading-6 text-slate-100 outline-none transition focus:border-brand-400 focus:ring-2 focus:ring-brand-500/30"
            placeholder="flowchart TD\n  A --> B"
          ></textarea>
          <div class="mt-4 flex flex-wrap gap-2">
            <button
              id="render"
              type="button"
              class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-400"
            >
              描画
            </button>
            <button
              id="copy"
              type="button"
              class="rounded-lg border border-white/15 bg-white/5 px-4 py-2 text-sm font-semibold text-slate-100 transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-slate-400/40"
            >
              コードをコピー
            </button>
            <button
              id="clear"
              type="button"
              class="rounded-lg border border-rose-300/20 bg-rose-500/10 px-4 py-2 text-sm font-semibold text-rose-200 transition hover:bg-rose-500/20 focus:outline-none focus:ring-2 focus:ring-rose-300/40"
            >
              クリア
            </button>
          </div>
          <p id="error" class="mt-3 min-h-[1.5rem] text-sm font-medium text-rose-300" aria-live="polite"></p>
        </article>

        <div
          id="split-handle"
          class="hidden lg:flex lg:w-4 lg:cursor-col-resize lg:items-center lg:justify-center"
          role="separator"
          aria-orientation="vertical"
          aria-label="Mermaid 記法とプレビューの幅を調整"
        >
          <div class="h-16 w-1 rounded-full bg-white/20"></div>
        </div>

        <article
          id="preview-panel"
          class="rounded-2xl border border-white/10 bg-slate-900/75 p-5 shadow-glow backdrop-blur lg:min-w-0 lg:rounded-l-none"
          style="flex-basis: var(--preview-pane-width);"
        >
          <div class="mb-3 flex items-center justify-between gap-3">
            <h2 class="text-sm font-semibold text-slate-100">プレビュー</h2>
            <div class="flex items-center gap-2">
              <button
                id="preview-fullscreen"
                type="button"
                class="rounded-lg border border-white/15 bg-white/5 px-3 py-1 text-xs font-semibold text-slate-100 transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-slate-400/40"
              >
                全画面
              </button>
              <span class="rounded-full border border-emerald-300/30 bg-emerald-500/10 px-3 py-1 text-xs text-emerald-100">SVG Output</span>
            </div>
          </div>
          <div id="preview" class="h-[27rem] overflow-auto rounded-xl border border-white/10 bg-white p-4 text-slate-900"></div>
          <p
            id="message"
            class="mt-3 min-h-[3rem] rounded-lg border border-brand-300/20 bg-brand-500/10 p-3 text-sm leading-6 text-brand-50"
          >
            ノードをクリックすると、ここに説明が表示されます。
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
